; Dual-boot launcher — one project, one env per board.
[platformio]
boards_dir = ../boards

[launcher_common]
platform = espressif32@6.7.0
framework = arduino

board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.partitions = ../partitions/dual-16mb.csv
board_upload.flash_size = 16MB

build_unflags =
    -std=gnu++11

lib_deps =
    lovyan03/LovyanGFX@1.1.16

monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool

[env:tdeck_launcher]
extends = launcher_common
board = esp32-s3-devkitc-1
build_src_filter = +<tdeck/>
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I../src/core
    -I../src/ui/lvgl
    -I../src/boards/tdeck
    -I../src/boards/tdeck/platform

[env:tpager_launcher]
extends = launcher_common
board = lilygo_t_pager
board_build.f_flash = 80000000L
board_build.arduino.memory_type = dio_qspi
upload_flags = --no-stub
build_src_filter = +<tpager/>
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I../src/core
    -I../src/ui/lvgl
    -I../src/boards/tpager
    -I../src/boards/tpager/platform

; Cardputer Adv launcher — donor-exact 8MB env (M5 stack, no LovyanGFX/shims),
; deliberately NOT extending launcher_common (16MB + LovyanGFX tier).
[env:cardputer_launcher]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 8MB
board_build.partitions = ../partitions/dual-8mb.csv
board_upload.flash_size = 8MB

build_src_filter = +<cardputer/>
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I../src/boards/cardputer/platform

build_unflags =
    -std=gnu++11

lib_deps =
    https://github.com/m5stack/M5GFX.git#53a7184601f3667b030ba141c58b87ce2acfaa2a
    https://github.com/m5stack/M5Unified.git#a6256725481f1bc366655fa48cf03b6095e30ad1
    https://github.com/m5stack/M5Cardputer.git#e0232804763d3e42d7e9be90e43cf6e1c9e7565b
    https://github.com/Arduino-IRremote/Arduino-IRremote.git#69d36199d606ab56de1f0f990f2b01f416a9cc9f

monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool
